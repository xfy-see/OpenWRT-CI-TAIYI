name: ZN-M2-NSS
run-name: ZN M2 NSS / ${{ inputs.mode }} / ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'config：只检查配置；build：完整固件及同 ABI 离线软件包'
        required: true
        default: build
        type: choice
        options: [config, build]
      jobs:
        description: '编译并行数（内存紧张时选 2）'
        required: true
        default: '2'
        type: choice
        options: ['2', '4']

permissions:
  contents: read

concurrency:
  group: zn-m2-nss-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LC_ALL: C
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install official Ubuntu build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            clang cmake cpio curl device-tree-compiler file flex gawk gettext git \
            gperf libelf-dev libfuse-dev libncurses-dev libssl-dev libtool lld llvm \
            ninja-build patch pkgconf python3 python3-pyelftools python3-setuptools \
            python3-yaml rsync subversion swig time unzip zlib1g-dev zstd
          df -h .

      - name: Validate locks, configuration and local tests
        run: |
          set -euo pipefail
          python3 Scripts/zn-m2-nss/build.py validate
          python3 -m unittest discover -s tests -v
          python3 Scripts/zn-m2-nss/verify-images.py --self-test

      - name: Restore verified source downloads only
        if: inputs.mode == 'build'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _work/downloads
          key: zn-m2-dl-${{ runner.os }}-${{ hashFiles('Config/ZN-M2-NSS.config', 'Config/ZN-M2-NSS/**', 'Scripts/zn-m2-nss/**') }}
          restore-keys: zn-m2-dl-${{ runner.os }}-

      - name: Prepare exact source and verify resolved Kconfig
        run: python3 Scripts/zn-m2-nss/build.py prepare

      - name: Compile firmware and every selected package together
        if: inputs.mode == 'build'
        env:
          BUILD_JOBS: ${{ inputs.jobs }}
        run: python3 Scripts/zn-m2-nss/build.py build --jobs "$BUILD_JOBS"

      - name: Verify images, ABI, signed indexes and offline package closure
        if: inputs.mode == 'build'
        run: python3 Scripts/zn-m2-nss/build.py package

      - name: Upload complete verified build
        if: inputs.mode == 'build'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zn-m2-nss-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: _work/artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload configuration-only result
        if: inputs.mode == 'config'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zn-m2-nss-config-${{ github.run_id }}-${{ github.run_attempt }}
          path: _work/reports/
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zn-m2-nss-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _work/logs/
            _work/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Explain verification boundary
        if: success()
        env:
          BUILD_MODE: ${{ inputs.mode }}
        run: |
          printf 'Mode: %s\n' "$BUILD_MODE" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'config 模式不代表完整编译通过。build 模式验证镜像/软件包结构和同构建 ABI，未验证实体硬件启动、端口、PPPoE、NSS 性能或稳定性。' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '只生成 Actions artifacts；不创建 Release、不上传私钥、不刷机。下载后请保留同一次运行的固件、离线包和校验值。' >> "$GITHUB_STEP_SUMMARY"
