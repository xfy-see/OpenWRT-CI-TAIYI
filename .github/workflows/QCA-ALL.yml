name: QCA-ALL

# 旧的移动分支/外部脚本构建入口已退役。保留名称，避免误用旧入口。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  information:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Show supported build entry
        run: |
          printf '%s\n' 'QCA-ALL 的旧编译流程已退役，本任务不会下载或执行外部源码。' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '中兴 ZN M2 请在 Actions 中手动运行 ZN-M2-NSS，选择 config 检查或 build 编译。' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '京东云太乙尚未迁移到这个固定版本入口，请勿使用 ZN M2 镜像。旧配置/核心脚本只保留作参考。' >> "$GITHUB_STEP_SUMMARY"
