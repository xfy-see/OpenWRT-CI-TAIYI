name: Auto-Clean

# 历史任务曾每天删除全部 Release、标签和运行记录。
# 改为手动只读盘点，保留固件及同 ABI 软件包的追溯链。
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: List retained releases and workflow runs (no deletion)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release list --repo "$GH_REPO" --limit 30
          gh run list --repo "$GH_REPO" --limit 30
          printf '%s\n' '只读检查完成，未删除任何 Release、标签、artifact 或运行记录。' >> "$GITHUB_STEP_SUMMARY"
